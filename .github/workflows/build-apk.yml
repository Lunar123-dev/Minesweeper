name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Dependencies
        run: npm install

      # Xóa thư mục android và www cũ (nếu có) để làm sạch
      - name: 4. Clean Directories
        run: rm -rf android www

      # Tự động tạo thư mục www và copy toàn bộ code web vào đó
      - name: 4.1 Prepare Web Directory
        run: |
          mkdir www
          cp index.html style.css game.js favicon.svg icon.png www/
          cp -r assets www/

      - name: 5. Init Capacitor Android Platform
        run: npx cap add android

      - name: 6. Generate App Icons and Splash Screens
        run: npx @capacitor/assets generate --iconBackgroundColor '#0b1120' --splashBackgroundColor '#0b1120'

      - name: 7. Sync Web Code to Android
        run: npx cap sync android

      - name: 8. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 9. Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
